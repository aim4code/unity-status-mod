name: Feature request
description: Something the band should show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what's missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What the band would show or do. If it needs to run something new on the user's machine, say what.
    validations:
      required: true
